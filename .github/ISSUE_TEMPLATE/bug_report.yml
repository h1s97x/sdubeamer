name: Bug Report / Bug 报告
description: Report a problem with the SDUBeamer theme / 报告 SDUBeamer 模板的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below to help us reproduce and fix it quickly.
        感谢报告 Bug！请填写以下表单，帮助我们快速复现并修复。

  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Which version of the theme are you using? (e.g. `main`, tag name) / 你使用的是哪个版本？
      placeholder: "main"
    validations:
      required: true

  - type: textarea
    id: minimal-example
    attributes:
      label: Minimal reproducible example / 最小复现示例
      description: Paste a minimal LaTeX snippet that reproduces the issue / 粘贴可复现问题的最小 LaTeX 片段
      render: latex
      placeholder: |
        \documentclass{beamer}
        \usepackage{sdubeamer}
        \begin{document}
        \begin{frame}{标题}
          内容
        \end{frame}
        \end{document}
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Describe the exact steps / 描述精确的复现步骤
      placeholder: |
        1. 使用 xelatex 编译上述示例
        2. 观察 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
      description: What did you expect to happen? / 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: What actually happened? Include error logs if available / 实际发生了什么？如有错误日志请一并提供
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: TeX distribution, compiler engine, OS, etc. / 运行环境（TeX 发行版、编译引擎、操作系统等）
      placeholder: "TeX Live 2025, xelatex, macOS"

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification / 确认
      description: Please confirm before submitting / 提交前请确认
      options:
        - label: I have searched existing issues for the same problem / 我已搜索过现有 Issue，确认没有相同问题
          required: true
